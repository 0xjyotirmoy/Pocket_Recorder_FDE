# docker compose up --build   ->  http://localhost:8000
# Put GROQ_API_KEY in a .env file next to this one (never commit it).
services:
  fieldnotes:
    build: .
    ports: ["8000:8000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - fieldnotes-data:/data
    restart: unless-stopped
volumes:
  fieldnotes-data:
